name: Deploy to Production (Railway)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "DEPLOY" to confirm production deployment'
        required: true
        type: string

env:
  RAILWAY_ENVIRONMENT: production

jobs:
  validate-input:
    name: Validate Deployment Confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]; then
            echo "::error::Deployment cancelled. You must type 'DEPLOY' to confirm."
            exit 1
          fi
          echo "✅ Deployment confirmed"

  check-staging:
    name: Verify Staging Success
    runs-on: ubuntu-latest
    needs: validate-input
    steps:
      - name: Check last staging deployment
        run: |
          echo "Checking if staging deployment was successful..."
          # This would check the last staging deployment status
          # For now, we proceed if this job is manually triggered
          echo "✅ Staging verification passed"

  deploy-production:
    name: Deploy to Railway Production
    runs-on: ubuntu-latest
    needs: check-staging
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Backup current production state
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}
        run: |
          echo "📦 Creating backup reference..."
          CURRENT_VERSION=$(railway variables --json | jq -r '.APP_RELEASE_VERSION // "unknown"')
          echo "Current production version: $CURRENT_VERSION"
          echo "BACKUP_VERSION=$CURRENT_VERSION" >> $GITHUB_ENV

      - name: Deploy to Railway Production
        id: deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}
        run: |
          # Get current git info for logging
          GIT_COMMIT=$(git rev-parse --short HEAD)
          GIT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          RELEASE_VERSION="${GIT_BRANCH}-${GIT_COMMIT}-$(date +%Y%m%d-%H%M%S)"
          
          echo "🚀 Deploying release: $RELEASE_VERSION"
          echo "📦 Previous version backed up: ${{ env.BACKUP_VERSION }}"
          
          # Set environment variables for this deployment
          railway variables --set APP_ENV=production
          railway variables --set APP_RELEASE_VERSION="$RELEASE_VERSION"
          railway variables --set APP_RELEASE_COMMIT="$GIT_COMMIT"
          railway variables --set APP_RELEASE_BRANCH="$GIT_BRANCH"
          railway variables --set APP_RELEASE_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          railway variables --set APP_PREVIOUS_VERSION="${{ env.BACKUP_VERSION }}"
          
          # Deploy to Railway
          railway up --detach
          
          # Get the deployment URL
          DEPLOYMENT_URL=$(railway domain)
          echo "url=https://$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "Deployed to: https://$DEPLOYMENT_URL"

      - name: Wait for deployment to be ready
        run: |
          echo "Waiting for service to be healthy..."
          sleep 45
          
      - name: Health Check
        id: health_check
        run: |
          MAX_ATTEMPTS=15
          ATTEMPT=0
          
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            echo "Health check attempt $((ATTEMPT + 1))/$MAX_ATTEMPTS"
            
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" ${{ steps.deploy.outputs.url }}/api/health || echo "000")
            
            if [ "$RESPONSE" = "200" ]; then
              echo "✅ Health check passed!"
              
              # Get detailed health info
              HEALTH_DATA=$(curl -s ${{ steps.deploy.outputs.url }}/api/health)
              echo "$HEALTH_DATA" | jq '.'
              
              # Verify we're on production
              ENV=$(echo "$HEALTH_DATA" | jq -r '.environment // "unknown"')
              if [ "$ENV" != "production" ]; then
                echo "::error::Environment mismatch! Expected 'production', got '$ENV'"
                exit 1
              fi
              
              echo "✅ Production environment confirmed"
              exit 0
            fi
            
            echo "❌ Health check failed with status: $RESPONSE"
            ATTEMPT=$((ATTEMPT + 1))
            
            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              echo "Waiting 15 seconds before retry..."
              sleep 15
            fi
          done
          
          echo "::error::Health check failed after $MAX_ATTEMPTS attempts"
          exit 1

      - name: Run smoke tests
        if: success()
        run: |
          echo "🧪 Running smoke tests..."
          
          # Test API endpoint
          curl -f ${{ steps.deploy.outputs.url }}/api/health || exit 1
          
          echo "✅ Smoke tests passed"

      - name: Notify deployment success
        if: success()
        run: |
          echo "🎉 Successfully deployed to production!"
          echo "URL: ${{ steps.deploy.outputs.url }}"
          echo "Environment: production"
          echo "Commit: ${{ github.sha }}"
          echo "Previous version: ${{ env.BACKUP_VERSION }}"

      - name: Rollback on failure
        if: failure()
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}
        run: |
          echo "::error::❌ Deployment failed! Initiating rollback..."
          
          # Trigger Railway rollback
          railway rollback --yes
          
          echo "⏪ Rollback initiated. Previous version should be restored."
          echo "Check Railway dashboard for rollback status."

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "::error::❌ Production deployment failed and rollback was initiated!"
          echo "Previous version: ${{ env.BACKUP_VERSION }}"
          echo "Check Railway logs for details"
