name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production

jobs:
  check_staging:
    name: Verify Staging Success
    runs-on: ubuntu-latest
    steps:
      - name: Check Last Staging Deployment
        uses: actions/github-script@v7
        with:
          script: |
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy_staging.yml',
              branch: 'main',
              status: 'completed',
              per_page: 1
            });

            if (runs.workflow_runs.length === 0) {
              throw new Error('❌ No staging deployments found');
            }

            const lastRun = runs.workflow_runs[0];
            if (lastRun.conclusion !== 'success') {
              throw new Error(`❌ Last staging deployment failed: ${lastRun.conclusion}`);
            }

            console.log(`✅ Last staging deployment successful (${lastRun.run_number})`);

  deploy_production:
    name: Deploy to Production Environment
    runs-on: ubuntu-latest
    needs: check_staging
    environment: production
    
    steps:
      - uses: actions/checkout@v4

      - name: Download Frontend Build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: public/build/

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRODUCTION_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.PRODUCTION_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Production via SSH
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_PATH: ${{ secrets.PRODUCTION_PATH }}
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ github.ref_name }}-${{ github.run_number }}
        run: |
          DEPLOY_DIR="${PRODUCTION_PATH}/releases/${GITHUB_SHA:0:8}"
          CURRENT_LINK="${PRODUCTION_PATH}/current"
          PREVIOUS_LINK="${PRODUCTION_PATH}/previous"
          RELEASE_DATE=$(date '+%Y-%m-%d %H:%M:%S')
          
          ssh -i ~/.ssh/deploy_key ${PRODUCTION_USER}@${PRODUCTION_HOST} << 'EOF'
          set -e
          
          echo "🚀 [${RELEASE_DATE}] PRODUCTION DEPLOYMENT STARTED"
          echo "├─ Release: ${GITHUB_SHA:0:8}"
          echo "├─ Version: ${RELEASE_VERSION}"
          echo "└─ User: $USER"
          
          # 1. Crear directorio de release
          mkdir -p "${DEPLOY_DIR}"
          
          # 2. Sincronizar archivos
          echo "📦 Syncing application files..."
          rsync -avz \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='storage/logs' \
            --exclude='.git' \
            --exclude='previous' \
            --exclude='releases' \
            . "${DEPLOY_DIR}/"
          
          # 3. Copiar variables de entorno
          echo "⚙️ Configuring environment..."
          cp "${PRODUCTION_PATH}/.env.production" "${DEPLOY_DIR}/.env"
          
          # 4. Instalar dependencias
          echo "📚 Installing dependencies..."
          cd "${DEPLOY_DIR}"
          composer install --no-dev --optimize-autoloader --no-interaction
          npm ci --omit=dev
          
          # 5. Limpiar cachés
          echo "🧹 Clearing caches..."
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan cache:clear
          
          # 6. Ejecutar migraciones
          echo "🗄️ Running database migrations..."
          php artisan migrate --force
          
          # 7. Link de storage
          php artisan storage:link
          
          # 8. Backup del symlink anterior (para rollback)
          echo "💾 Backing up current release..."
          if [ -L "${CURRENT_LINK}" ]; then
            rm -f "${PREVIOUS_LINK}"
            ln -s "$(readlink ${CURRENT_LINK})" "${PREVIOUS_LINK}"
          fi
          
          # 9. Cambiar symlink atomicamente
          echo "🔗 Switching symlink (atomic)..."
          ln -sfn "${DEPLOY_DIR}" "${CURRENT_LINK}.tmp"
          mv -Tf "${CURRENT_LINK}.tmp" "${CURRENT_LINK}"
          
          echo "✅ [${RELEASE_DATE}] PRODUCTION DEPLOYMENT COMPLETED"
          echo "├─ Current: ${DEPLOY_DIR}"
          echo "├─ Previous: $(readlink ${PREVIOUS_LINK} 2>/dev/null || echo 'N/A')"
          echo "└─ Status: ACTIVE"
          EOF
        shell: bash

      - name: Health Check
        run: |
          PRODUCTION_URL="${{ secrets.PRODUCTION_URL }}"
          MAX_ATTEMPTS=30
          ATTEMPT=1
          
          echo "🏥 Checking production health endpoint..."
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${PRODUCTION_URL}/api/health")
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Production health check passed (HTTP 200)"
              exit 0
            fi
            
            echo "⏳ Attempt $ATTEMPT/$MAX_ATTEMPTS - HTTP $HTTP_CODE"
            sleep 5
            ATTEMPT=$((ATTEMPT + 1))
          done
          
          echo "❌ Health check failed - initiating rollback..."
          exit 1

      - name: Rollback on Failure
        if: failure()
        run: |
          ssh -i ~/.ssh/deploy_key ${PRODUCTION_USER}@${PRODUCTION_HOST} << 'EOF'
          set -e
          
          CURRENT_LINK="${PRODUCTION_PATH}/current"
          PREVIOUS_LINK="${PRODUCTION_PATH}/previous"
          RELEASE_DATE=$(date '+%Y-%m-%d %H:%M:%S')
          
          echo "⚠️ [${RELEASE_DATE}] ROLLBACK INITIATED"
          
          if [ -L "${PREVIOUS_LINK}" ]; then
            PREVIOUS_DIR=$(readlink "${PREVIOUS_LINK}")
            ln -sfn "${PREVIOUS_DIR}" "${CURRENT_LINK}.tmp"
            mv -Tf "${CURRENT_LINK}.tmp" "${CURRENT_LINK}"
            
            echo "✅ [${RELEASE_DATE}] ROLLBACK COMPLETED"
            echo "└─ Restored: ${PREVIOUS_DIR}"
          else
            echo "❌ No previous release found for rollback"
            exit 1
          fi
          EOF

      - name: Notify Production Deployment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const prodUrl = '${{ secrets.PRODUCTION_URL }}';
            const sha = context.payload.workflow_run?.head_commit?.id || context.sha;
            
            const message = status === 'success'
              ? `🎉 **PRODUCTION DEPLOYMENT SUCCESSFUL**\n📍 ${prodUrl}\n⏰ Deployed by: ${{ github.actor }}`
              : `⚠️ **PRODUCTION DEPLOYMENT FAILED**\n🔄 Rollback executed\n📍 ${prodUrl}`;
            
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha,
              body: message
            });
