name: Deploy to Staging (Railway)

on:
  workflow_dispatch:

env:
  RAILWAY_ENVIRONMENT: staging

jobs:
  # Wait for CI to complete successfully
  wait-for-ci:
    name: Wait for CI Success
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI workflow
        uses: lewagon/wait-on-check-action@v1.3.1
        with:
          ref: ${{ github.sha }}
          check-name: 'CI Pipeline'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

  deploy-staging:
    name: Deploy to Railway Staging
    runs-on: ubuntu-latest
    needs: wait-for-ci
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway Staging
        id: deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
        run: |
          # Get current git info for logging
          GIT_COMMIT=$(git rev-parse --short HEAD)
          GIT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          RELEASE_VERSION="${GIT_BRANCH}-${GIT_COMMIT}-$(date +%Y%m%d-%H%M%S)"
          
          echo "Deploying release: $RELEASE_VERSION"
          
          # Set environment variables for this deployment
          railway variables --set APP_ENV=staging
          railway variables --set APP_RELEASE_VERSION="$RELEASE_VERSION"
          railway variables --set APP_RELEASE_COMMIT="$GIT_COMMIT"
          railway variables --set APP_RELEASE_BRANCH="$GIT_BRANCH"
          railway variables --set APP_RELEASE_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          
          # Deploy to Railway
          railway up --detach
          
          # Get the deployment URL
          DEPLOYMENT_URL=$(railway domain)
          echo "url=https://$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "Deployed to: https://$DEPLOYMENT_URL"

      - name: Wait for deployment to be ready
        run: |
          echo "Waiting for service to be healthy..."
          sleep 30
          
      - name: Health Check
        id: health_check
        run: |
          MAX_ATTEMPTS=10
          ATTEMPT=0
          
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            echo "Health check attempt $((ATTEMPT + 1))/$MAX_ATTEMPTS"
            
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" ${{ steps.deploy.outputs.url }}/api/health || echo "000")
            
            if [ "$RESPONSE" = "200" ]; then
              echo "✅ Health check passed!"
              
              # Get detailed health info
              curl -s ${{ steps.deploy.outputs.url }}/api/health | jq '.'
              
              exit 0
            fi
            
            echo "❌ Health check failed with status: $RESPONSE"
            ATTEMPT=$((ATTEMPT + 1))
            
            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              echo "Waiting 10 seconds before retry..."
              sleep 10
            fi
          done
          
          echo "::error::Health check failed after $MAX_ATTEMPTS attempts"
          exit 1

      - name: Notify deployment success
        if: success()
        run: |
          echo "🚀 Successfully deployed to staging!"
          echo "URL: ${{ steps.deploy.outputs.url }}"
          echo "Environment: staging"
          echo "Commit: ${{ github.sha }}"

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "::error::❌ Deployment to staging failed!"
          echo "Check Railway logs for details"
