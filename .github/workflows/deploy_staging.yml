name: Deploy to Staging

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]

jobs:
  deploy_staging:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    environment: staging
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4

      - name: Download Frontend Build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: public/build/

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Staging via SSH
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          # Variables
          DEPLOY_DIR="${STAGING_PATH}/releases/${GITHUB_SHA:0:8}"
          CURRENT_LINK="${STAGING_PATH}/current"
          RELEASE_DATE=$(date '+%Y-%m-%d %H:%M:%S')
          
          ssh -i ~/.ssh/deploy_key ${STAGING_USER}@${STAGING_HOST} << 'EOF'
          set -e
          
          echo "🚀 [$(date '+%Y-%m-%d %H:%M:%S')] Starting deployment to staging..."
          
          # 1. Crear directorio de release
          mkdir -p "${DEPLOY_DIR}"
          
          # 2. Sincronizar archivos
          echo "📦 Syncing files..."
          rsync -avz \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='storage/logs' \
            --exclude='.git' \
            . "${DEPLOY_DIR}/"
          
          # 3. Copiar variables de entorno
          echo "⚙️ Configuring environment..."
          cp "${STAGING_PATH}/.env.staging" "${DEPLOY_DIR}/.env"
          
          # 4. Instalar dependencias
          echo "📚 Installing dependencies..."
          cd "${DEPLOY_DIR}"
          composer install --no-dev --optimize-autoloader --no-interaction
          npm ci --omit=dev
          
          # 5. Limpiar cachés
          echo "🧹 Clearing caches..."
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan cache:clear
          
          # 6. Ejecutar migraciones
          echo "🗄️ Running migrations..."
          php artisan migrate --force
          
          # 7. Link de storage
          php artisan storage:link
          
          # 8. Cambiar symlink atomicamente
          echo "🔗 Updating symlink..."
          ln -sfn "${DEPLOY_DIR}" "${CURRENT_LINK}.tmp"
          mv -Tf "${CURRENT_LINK}.tmp" "${CURRENT_LINK}"
          
          echo "✅ Deployment completed at ${RELEASE_DATE}"
          EOF
        shell: bash

      - name: Health Check
        run: |
          STAGING_URL="${{ secrets.STAGING_URL }}"
          MAX_ATTEMPTS=30
          ATTEMPT=1
          
          echo "🏥 Checking health endpoint..."
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${STAGING_URL}/api/health")
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Health check passed (HTTP 200)"
              exit 0
            fi
            
            echo "⏳ Attempt $ATTEMPT/$MAX_ATTEMPTS - HTTP $HTTP_CODE"
            sleep 5
            ATTEMPT=$((ATTEMPT + 1))
          done
          
          echo "❌ Health check failed after $MAX_ATTEMPTS attempts"
          exit 1

      - name: Notify Deployment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const sha = context.payload.workflow_run.head_commit.message;
            const deployUrl = '${{ secrets.STAGING_URL }}';
            
            const message = status === 'success'
              ? `✅ Deployment to **staging** successful\n📍 ${deployUrl}`
              : `❌ Deployment to **staging** failed`;
            
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.payload.workflow_run.head_commit.id,
              body: message
            });
